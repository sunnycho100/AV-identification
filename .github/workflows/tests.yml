name: Maintained interfaces
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install -e ".[dev]"
      - run: ruff check code/src code/tests code/tools code/manage.py
      - run: python code/manage.py test
      - run: python code/manage.py demo
      - run: python code/manage.py doctor
      - run: python code/manage.py release
