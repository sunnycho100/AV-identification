[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadside-identification"
version = "0.1.0"
description = "Roadside trajectory preparation and source-only ACC/HV identification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<2", "pandas>=1.5,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
classifier = ["torch>=2.6,<2.7"]
analysis = ["matplotlib>=3.7", "scikit-learn>=1.3", "pyproj>=3.5", "openpyxl>=3.1"]
dev = ["ruff>=0.8,<1"]

[project.scripts]
roadside = "roadside_identification.cli:main"

[tool.setuptools.packages.find]
where = ["code/src"]
include = ["roadside_identification*"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["code/src/**/*.py", "code/tests/**/*.py", "code/tools/**/*.py", "code/manage.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
