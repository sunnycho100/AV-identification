<!doctype html><html><meta charset="utf-8"><title>Isolated review UI verification</title><body style="margin:0"><iframe id="app" src="/trajectory-review/?project=synthetic_demo" style="width:100%;height:1300px;border:0"></iframe><pre id="result">RUNNING</pre><script>
(async()=>{const checks=[],errors=[];let w,d,exported;const iframe=document.getElementById('app');
function check(name,value){checks.push({name,pass:!!value});if(!value)throw Error(name);}
async function wait(fn){for(let i=0;i<500;i++){try{if(fn())return;}catch(e){}await new Promise(r=>setTimeout(r,25));}throw Error('timeout waiting for UI');}
function change(id,value){const e=d.getElementById(id);if(e.type==='checkbox')e.checked=value;else e.value=value;e.dispatchEvent(new w.Event('change'));}
async function jump(frame){d.getElementById('jumpFrame').value=frame;d.getElementById('jump').click();await wait(()=>w.eval(`S.imageFrame===${frame}`));}
function pointer(type,x,y){const c=d.getElementById('frameCanvas'),r=c.getBoundingClientRect();c.setPointerCapture=()=>{};c.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:1,button:0,clientX:r.left+x/c.width*r.width,clientY:r.top+y/c.height*r.height}));}
try{await wait(()=>iframe.contentWindow.eval('typeof S!=="undefined" && !!S.image'));w=iframe.contentWindow;d=w.document;w.addEventListener('error',e=>errors.push(e.message));
check('synthetic_project_isolated',w.eval('S.project.demo && S.records.length===0'));
d.querySelectorAll('#cases button')[1].click();await wait(()=>w.eval('S.case.clip==="DEMO_FROZEN_TAIL" && S.imageFrame===0'));
check('all_native_frames_available',d.getElementById('timeline').max==='50');
pointer('pointerdown',120,240);pointer('pointerup',120,240);check('candidate_click_marks_ego',w.eval('S.draft.anchors[0].source==="candidate"'));
await jump(30);pointer('pointerdown',435,215);pointer('pointermove',530,277);pointer('pointerup',530,277);check('manual_anchor_native_coordinates',w.eval('S.draft.anchors.length===2 && S.draft.anchors[1].bbox[0]===435'));
await jump(41);d.getElementById('freezeTail').click();check('frozen_tail_and_trim_recorded',w.eval('S.draft.excluded_ranges[0].start_frame===41 && S.draft.trim.keep_end_frame===40'));
change('endFrame',45);check('trim_conflict_shows_both_ranges_immediately',d.getElementById('rangeStatus').textContent.includes('0–45')&&d.getElementById('rangeStatus').textContent.includes('0–40')&&!d.getElementById('fitInterval').hidden);
d.getElementById('fitInterval').click();check('explicit_fit_keeps_freeze_boundary_and_anchors',w.eval('S.draft.end_frame===40 && S.draft.trim.keep_end_frame===40 && S.draft.anchors.length===2'));
change('endFrame',30);change('trimEnd',20);d.getElementById('fitInterval').click();check('short_fit_keeps_outside_anchors_for_review',w.eval('S.draft.end_frame===20 && S.draft.anchors.length===2')&&d.querySelectorAll('.anchor-chip.outside').length===1&&d.getElementById('notice').textContent.includes('不足三秒'));
change('endFrame',30);d.getElementById('trimEnd').value='';d.getElementById('trimEnd').dispatchEvent(new w.Event('input'));check('blank_trim_is_invalid_not_frame_zero',w.eval('S.draft.trim.keep_end_frame===null')&&d.getElementById('fitInterval').hidden);
d.getElementById('trimEnd').value=40;d.getElementById('trimEnd').dispatchEvent(new w.Event('input'));check('numeric_edit_saved_before_blur',w.eval('JSON.parse(localStorage.getItem(storageKey)).DEMO_FROZEN_TAIL.trim.keep_end_frame===40')&&d.getElementById('rangeStatus').className==='range-status');
change('identity',true);change('decision','ready_for_retracking');change('note','SYNTHETIC BROWSER QA ONLY');d.getElementById('note').dispatchEvent(new w.Event('input'));
d.getElementById('save').click();await wait(()=>d.getElementById('notice').className==='success');check('server_save_and_history',w.eval('S.records.length===1 && S.revisions.length===1'));
const firstFile=w.eval('S.revisions[0].file');d.getElementById('save').click();await wait(()=>w.eval('S.revisions.length===2'));check('second_save_preserves_first',w.eval('S.revisions[0].file')===firstFile);
change('endFrame',20);d.getElementById('save').click();await wait(()=>d.getElementById('notice').className==='error');check('reject_short_ready_interval',w.eval('S.revisions.length===2'));change('endFrame',30);
const create=w.URL.createObjectURL,click=w.HTMLAnchorElement.prototype.click;w.URL.createObjectURL=b=>{exported=b;return 'blob:qa';};w.HTMLAnchorElement.prototype.click=function(){};d.getElementById('export').click();await wait(()=>!!exported);const json=await exported.text();check('export_schema_and_trim',JSON.parse(json).records[0].trim.keep_end_frame===40);w.URL.createObjectURL=create;w.HTMLAnchorElement.prototype.click=click;
const transfer=new w.DataTransfer();transfer.items.add(new w.File([json],'demo.json',{type:'application/json'}));d.getElementById('importFile').files=transfer.files;d.getElementById('importFile').dispatchEvent(new w.Event('change'));await wait(()=>d.getElementById('notice').textContent.includes('已导入'));check('import_is_draft_without_rewriting_history',w.eval('S.revisions.length===2 && S.draft.anchors.length===2'));
w.localStorage.removeItem('trajectory-review/synthetic_demo/drafts/v1');w.eval('S.dirty=false');iframe.src='/trajectory-review/?project=synthetic_demo';await wait(()=>iframe.contentWindow.document!==d&&iframe.contentWindow.eval('typeof S!=="undefined" && !!S.image'));
w=iframe.contentWindow;d=w.document;d.querySelectorAll('#cases button')[1].click();await wait(()=>w.eval('S.case.clip==="DEMO_FROZEN_TAIL" && S.imageFrame===0'));check('reload_restores_saved_anchors',w.eval('S.draft.anchors.length===2 && S.draft.excluded_ranges.length===1'));
const projects=await (await fetch('/api/projects')).json();const field=projects.projects.find(p=>p.id==='todd_se_extension');if(field){check('all_five_field_clips_present',field.cases.length===5);for(const c of field.cases){const data=await(await fetch(c.data_url)).json();check('full_frames_'+c.clip,data.frames.length===c.frames&&data.frames[0].frame===0);}
iframe.src='/trajectory-review/?project=todd_se_extension';await wait(()=>iframe.contentWindow.document!==d&&iframe.contentWindow.eval('typeof S!=="undefined" && !!S.image'));w=iframe.contentWindow;d=w.document;check('five_visible_review_cards',d.querySelectorAll('#cases button').length===5);[...d.querySelectorAll('#cases button')].find(b=>b.textContent.includes('HV_T_EW_2')).click();await wait(()=>w.eval('S.case.clip==="HV_T_EW_2" && S.imageFrame===0'));await jump(80);check('early_hv_ew2_native_frame_loaded',w.eval('S.image.naturalWidth===1920 && current().t_s<3'));check('no_real_field_annotations_created',w.eval('S.records.length===0'));
}
check('no_javascript_errors',errors.length===0);document.getElementById('result').textContent=JSON.stringify({status:'PASS',checks,errors});
}catch(e){document.getElementById('result').textContent=JSON.stringify({status:'FAIL',error:e.message,checks,errors});}finally{if(w)w.eval('S.dirty=false');}})();
</script></body></html>
